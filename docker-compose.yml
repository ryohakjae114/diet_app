version: "3"
services:
  db:
    image: postgres:15
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    env_file: ./.env
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 19000 -b '0.0.0.0'"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:19000:19000"
    depends_on:
      - db
    env_file: ./.env
