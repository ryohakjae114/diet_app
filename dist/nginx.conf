# /etc/nginx/sites-enabled/dietapp.conf に置くやつ

upstream DietAppBackend {
    server 127.0.0.1:19000 fail_timeout=0;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  # ドメイン名
  server_name johodiet1.htk3.net;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!MEDIUM:!LOW:!aNULL:!NULL:!SHA;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # 証明書のパスは適当に書き換える
  ssl_certificate     /etc/certs/htk3.net.cloudflare.pem;
  ssl_certificate_key /etc/certs/htk3.net.cloudflare.key;

  location / {
    proxy_pass http://DietAppBackend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
  }

  # ついでにF-Droid配布もする場合。何も考えてなければ消してよい
  location /fdroid {
    index index.html index.htm;
    root /home/qser/docker/fdroidserver/www;
    try_files $uri $uri/ =404;
  }
}

server {
  listen 80;
  listen [::]:80;
  # ドメイン名
  server_name johodiet1.htk3.net;

  location / {
    proxy_pass http://DietAppBackend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
  }

  # ついでにF-Droid配布もする場合。何も考えてなければ消してよい
  location /fdroid {
    index index.html index.htm;
    root /home/qser/docker/fdroidserver/www;
    try_files $uri $uri/ =404;
  }
}
